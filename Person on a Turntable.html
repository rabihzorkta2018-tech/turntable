<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Person on a Turntable</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5b6572;--ac:#2563eb;--rd:#dc2626;--ln:#d5d9e0;--tb:#e8ecf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2127;--tx:#e8eaee;--mut:#9aa4b2;--ac:#6ea0ff;--rd:#ff7b7b;--ln:#363c46;--tb:#2a303a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2127;--tx:#e8eaee;--mut:#9aa4b2;--ac:#6ea0ff;--rd:#ff7b7b;--ln:#363c46;--tb:#2a303a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:900px;margin:0 auto;padding:14px;display:grid;gap:12px}
h1{font-size:19px;margin:0}
.p{color:var(--mut);font-size:13px;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
canvas{width:min(100%,86vh,1000px);aspect-ratio:1/1;display:block;margin:0 auto}
.stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
@media (min-width:1000px){.w{max-width:1400px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}.w>div:first-child{grid-column:1/3}.stk{grid-row:2/4}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input[type=range]{width:100%}
b{color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;margin-right:6px}
button.s{background:var(--tb);color:var(--tx)}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13px}
.r div{background:var(--tb);border-radius:8px;padding:8px}
.r span{display:block;font-size:17px;font-weight:600}
</style></head><body><div class="w">
<div><h1>Person walking on a free turntable</h1>
<p class="p">Top view. Angular momentum about the axle is conserved: m·v·r + I·ω = 0 (system starts at rest).</p></div>
<div class="card stk"><canvas id="c" width="800" height="800"></canvas><div style="margin-top:8px;text-align:center"><button id="pl">Pause</button><button id="go" style="background:#16a34a">Start walking now</button><button id="stop" class="s">Stop walking</button><button class="s" id="rs">Reset</button></div></div>
<div class="card">

<div class="g">
<label>Person mass m: <b id="mv">60</b> kg<input id="m" type="range" min="20" max="120" step="1" value="60"></label>
<label>Walking speed v (ground, adjustable live): <b id="vv">1.5</b> m/s<input id="v" type="range" min="0" max="4" step="0.05" value="1.5"></label>
<label>Or schedule the start at t = <b id="stv">—</b> s<input id="st" type="range" min="0" max="15" step="0.5" value="2"></label>
<label>Turntable I: <b id="iv">500</b> kg·m²<input id="i" type="range" min="100" max="1500" step="10" value="500"></label>
<label>Radius r: 2 m (fixed) &nbsp;|&nbsp; Speed: <b id="sv">1</b>×<input id="sp" type="range" min="0.25" max="4" step="0.25" value="1"></label>
</div></div>
<div class="card r">
<div>Time<span id="t">0.0 s</span></div>
<div>Person ω (ground)<span id="wp"></span></div>
<div>Table ω (ground)<span id="wt"></span></div>
<div>Person speed rel. table<span id="vr"></span></div>
<div>L person<span id="lp"></span></div>
<div>L table<span id="lt"></span></div>
<div>Total L<span id="L"></span></div>
<div>θp person (angular abscissa)<span id="an"></span></div><div>θd disk (angular abscissa)<span id="an2"></span></div>
</div></div>
<script>
const $=id=>document.getElementById(id),cv=$("c"),x=cv.getContext("2d"),R=2;
let tp=0,tt=0,time=0,run=true,last=null,startAt=Infinity;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function P(){return{m:+$("m").value,v:time>=startAt?+$("v").value:0,I:+$("i").value}}
function om(){const{m,v,I}=P();return{wp:v/R,wt:-m*v*R/I}}
["m","v","i","sp","st"].forEach(k=>$(k).oninput=()=>{$("mv").textContent=$("m").value;$("vv").textContent=$("v").value;$("iv").textContent=$("i").value;$("sv").textContent=$("sp").value;$("stv").textContent=$("st").value;draw()});
$("pl").onclick=()=>{run=!run;$("pl").textContent=run?"Pause":"Play"};
$("rs").onclick=()=>{tp=tt=time=0;startAt=Infinity;draw()};
$("go").onclick=()=>{startAt=Math.min(startAt,time);$("st").value=Math.min(time,15);$("stv").textContent=startAt.toFixed(1);draw()};
$("stop").onclick=()=>{startAt=Infinity;draw()};
$("st").addEventListener("input",()=>{startAt=+$("st").value;draw()});
function arrow(x0,y0,x1,y1,col){x.strokeStyle=x.fillStyle=col;x.lineWidth=3;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();
const a=Math.atan2(y1-y0,x1-x0);x.beginPath();x.moveTo(x1,y1);x.lineTo(x1-10*Math.cos(a-.4),y1-10*Math.sin(a-.4));x.lineTo(x1-10*Math.cos(a+.4),y1-10*Math.sin(a+.4));x.fill()}
function draw(){
const{m,v,I}=P(),{wp,wt}=om(),W=cv.width,cx=W/2,cy=W/2,s=W/2/2.25;
x.clearRect(0,0,W,W);


const th=14*W/640,Rp=R*s;
const gr=x.createLinearGradient(cx-Rp,0,cx+Rp,0);gr.addColorStop(0,"#b97d2e");gr.addColorStop(.5,"#e0a04a");gr.addColorStop(1,"#b97d2e");
x.fillStyle=gr;x.strokeStyle="#9a6624";x.lineWidth=2;x.beginPath();x.moveTo(cx-Rp,cy);x.lineTo(cx-Rp,cy+th);x.arc(cx,cy+th,Rp,Math.PI,0,true);x.lineTo(cx+Rp,cy);x.closePath();x.fill();x.stroke();
x.strokeStyle=css("--mut");x.lineWidth=1.5;x.beginPath();x.moveTo(cx+Rp+14,cy);x.lineTo(cx+Rp+14,cy+th);x.moveTo(cx+Rp+9,cy);x.lineTo(cx+Rp+19,cy);x.moveTo(cx+Rp+9,cy+th);x.lineTo(cx+Rp+19,cy+th);x.stroke();
x.fillStyle=css("--mut");x.font="12px system-ui";x.textAlign="right";x.fillText("thickness h = 0.12 m",cv.width-6,cy-8);x.textAlign="left";
x.save();x.translate(cx,cy);x.rotate(-tt);
x.beginPath();x.arc(0,0,R*s,0,7);x.fillStyle="#f4bb6a";x.fill();x.save();x.clip();

x.restore();x.strokeStyle="#c98a3a";x.lineWidth=4;x.beginPath();x.arc(0,0,R*s,0,7);x.stroke();x.strokeStyle="#8a5a1f";x.lineWidth=2.5;
for(let k=0;k<12;k++){x.save();x.rotate(k*Math.PI/6);x.beginPath();x.moveTo(R*s-14,0);x.lineTo(R*s,0);x.stroke();x.restore()}

x.restore();
x.fillStyle=css("--tx");x.beginPath();x.arc(cx,cy,4,0,7);x.fill();
const px=cx+R*s*Math.cos(-tp),py=cy+R*s*Math.sin(-tp);
const rx=cx+R*s*Math.cos(-tt),ry=cy+R*s*Math.sin(-tt);
x.lineWidth=2.5;x.strokeStyle=css("--rd");x.beginPath();x.moveTo(cx,cy);x.lineTo(rx,ry);x.stroke();
x.strokeStyle=css("--ac");x.setLineDash([7,5]);x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke();x.setLineDash([]);
x.strokeStyle=css("--tx");x.lineWidth=2.5;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+R*s,cy);x.stroke();x.beginPath();x.arc(cx+R*s,cy,4,0,7);x.fillStyle=css("--tx");x.fill();
x.font="12px system-ui";x.fillText("fixed radius R = 2 m (t\u2080 = 0)",cx+R*s*.12,cy+18);
const arcA=(a,r,col,nm)=>{x.strokeStyle=x.fillStyle=col;x.lineWidth=2.5;x.beginPath();x.arc(cx,cy,r,0,-a,a>0);x.stroke();if(Math.abs(a)>0.1){const ph=-a,sg=a>0?-1:1,dx=-sg*Math.sin(ph),dy=sg*Math.cos(ph),L=16*W/640,tx=cx+r*Math.cos(ph),ty=cy+r*Math.sin(ph);x.beginPath();x.moveTo(tx+dx*4,ty+dy*4);x.lineTo(tx-dx*L-dy*L*.4,ty-dy*L+dx*L*.4);x.lineTo(tx-dx*L+dy*L*.4,ty-dy*L-dx*L*.4);x.closePath();x.fill()}if(Math.abs(a)>0.1){const mm=-a/2;x.font="bold 13px system-ui";x.textAlign="center";x.fillText(nm+"="+(a*180/Math.PI).toFixed(0)+"\u00b0",cx+(r+(nm==="\u03b8p"?22:-22))*Math.cos(mm),cy+(r+(nm==="\u03b8p"?22:-22))*Math.sin(mm)+4);x.textAlign="left"}};
arcA(tp,R*s*.62,css("--ac"),"\u03b8p");arcA(tt,R*s*.42,css("--rd"),"\u03b8d");
x.save();x.translate(px,py);x.rotate(Math.atan2(-Math.cos(tp),-Math.sin(tp)));x.scale(1.5*W/640,1.5*W/640);
const sw=v>0?Math.sin(time*9)*6:0;
x.lineCap="round";x.strokeStyle="#34495e";x.lineWidth=6;x.beginPath();x.moveTo(0,-5);x.lineTo(sw,-5);x.moveTo(0,5);x.lineTo(-sw,5);x.stroke();x.fillStyle="#7b3f1d";x.strokeStyle="#222";x.lineWidth=1.2;x.beginPath();x.ellipse(sw+4,-5,4.5,3.5,0,0,7);x.fill();x.stroke();x.beginPath();x.ellipse(-sw+4,5,4.5,3.5,0,0,7);x.fill();x.stroke();
x.strokeStyle="#f59e0b";x.lineWidth=5;x.lineCap="round";x.beginPath();x.moveTo(0,-10);x.lineTo(-sw*.8,-14);x.moveTo(0,10);x.lineTo(sw*.8,14);x.stroke();x.fillStyle="#f2c9a0";x.strokeStyle="#222";x.lineWidth=1;x.beginPath();x.arc(-sw*.8+1,-15,3,0,7);x.fill();x.stroke();x.beginPath();x.arc(sw*.8+1,15,3,0,7);x.fill();x.stroke();
x.fillStyle="#f59e0b";x.strokeStyle="#222";x.lineWidth=1.2;x.beginPath();x.ellipse(0,0,6,12,0,0,7);x.fill();x.stroke();
x.fillStyle="#f2c9a0";x.strokeStyle="#222";x.lineWidth=1.2;x.beginPath();x.arc(0,-8,2.5,0,7);x.fill();x.stroke();x.beginPath();x.arc(0,8,2.5,0,7);x.fill();x.stroke();x.beginPath();x.arc(1,0,8,0,7);x.fill();x.stroke();
x.fillStyle="#3b2a1d";x.beginPath();x.arc(1,0,8,Math.PI/2,Math.PI*1.5);x.fill();
x.fillStyle="#fff";x.strokeStyle="#222";x.lineWidth=.8;x.beginPath();x.arc(5,-3,2.2,0,7);x.fill();x.stroke();x.beginPath();x.arc(5,3,2.2,0,7);x.fill();x.stroke();x.fillStyle="#222";x.beginPath();x.arc(5.8,-3,1,0,7);x.fill();x.beginPath();x.arc(5.8,3,1,0,7);x.fill();x.fillStyle="#e0956a";x.beginPath();x.arc(8.5,0,1.6,0,7);x.fill();
x.restore();
if(v>0){arrow(px,py,px-Math.sin(tp)*v*28,py-Math.cos(tp)*v*28,css("--ac"))}
x.fillStyle=css("--tx");x.fillText("person (m)",px+14,py-12);
x.fillStyle=css("--rd");x.strokeStyle="#fff";x.lineWidth=2;x.beginPath();x.arc(rx,ry,6,0,7);x.fill();x.stroke();
x.fillStyle=css("--rd");x.fillText("red mark (on table)",rx+12,ry+20);
x.fillStyle=css("--mut");x.fillText("red radius = table (blue dashed = person)",10,cv.height-12);
x.fillText(wt<0?"table spins clockwise":"",W-170,22);
$("t").textContent=time.toFixed(1)+" s";
x.fillStyle=css("--mut");x.font="14px system-ui";x.fillText(time<startAt?(startAt===Infinity?"Standing still – press “Start walking now”":"Standing still – walks at t = "+startAt+" s"):(v>0?"Walking":"Person stopped (v = 0)"),10,22);
$("wp").textContent=wp.toFixed(3)+" rad/s ↺";
$("wt").textContent=Math.abs(wt).toFixed(3)+" rad/s "+(wt<0?"↻":"");
$("vr").textContent=((wp-wt)*R).toFixed(2)+" m/s";
const lp=m*v*R,lt=I*wt;
$("lp").textContent=lp.toFixed(0)+" kg·m²/s";$("lt").textContent=lt.toFixed(0)+" kg·m²/s";$("L").textContent=(lp+lt).toFixed(0);
const d=a=>(((a*180/Math.PI)%360)+360)%360;
$("an").textContent=tp.toFixed(2)+" rad ("+(tp*180/Math.PI).toFixed(0)+"\u00b0)";$("an2").textContent=tt.toFixed(2)+" rad ("+(tt*180/Math.PI).toFixed(0)+"\u00b0)";
}
function f(ts){if(last!==null&&run){const dt=Math.min((ts-last)/1000,.05)*+$("sp").value,w=om();tp+=w.wp*dt;tt+=w.wt*dt;time+=dt}last=ts;draw();requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
